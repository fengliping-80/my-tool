<script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
<script>
    // DOM 元素
    const roomNumberSpan = document.getElementById('roomNumber');
    const copyRoomBtn = document.getElementById('copyRoomBtn');
    const refreshRoomBtn = document.getElementById('refreshRoomBtn');
    const targetRoomInput = document.getElementById('targetRoomInput');
    const connectBtn = document.getElementById('connectBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const statusLed = document.getElementById('statusLed');
    const statusTextSpan = document.getElementById('statusText');
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const selectedFilesList = document.getElementById('selectedFilesList');
    const sendBtn = document.getElementById('sendBtn');
    const receivedArea = document.getElementById('receivedArea');
    const logArea = document.getElementById('logArea');

    // 状态变量
    let peer = null;
    let currentConn = null;
    let myRoomId = null;      // 4位房间号
    let actualPeerId = null;  // PeerJS真实ID（用于连接）
    let isConnected = false;
    let pendingFiles = [];
    
    // 房间号映射表（存储房间号对应的真实peerId）
    // 由于PeerJS不能自定义ID，我们需要一个简单的映射机制
    // 使用localStorage + storage事件来实现跨标签页/跨设备的房间号发现
    // 但跨设备无法共享localStorage，所以我们需要一个更好的方案：
    // 使用PeerJS的discovery机制？不行。
    // 解决方案：让每个设备将自己的房间号和peerId注册到一个临时的地方
    // 最简单：使用一个公共的免费Firebase？太重了。
    // 替代方案：直接在输入房间号时，通过PeerJS的connect尝试连接一个构造的ID？
    // 更好的方案：使用房间号作为peerId的一部分，但PeerJS要求全局唯一
    // 最实用：房间号只是便于记忆，实际连接时通过信令服务器自动匹配
    // 为了简化且完全可用，我使用一个简单的信令：每个设备将自己的房间号和peerId注册到localStorage
    // 但对于跨设备，可以用一个简单的广播？不可靠。
    // 为了确保100%可用，我改为使用房间号+信令匹配：通过一个简单的WebSocket公共信令？不推荐。
    // 最终方案：使用房间号作为自定义peerId的种子，PeerJS支持自定义ID！
    // PeerJS的new Peer(id)可以指定ID，只要ID全局唯一就行
    // 让用户输入4位数字作为房间号，然后以"room_" + 房间号作为peerId
    // 这样双方都用同一个房间号创建peer，就可以直接连接！
    // 但是需要确保房间号没有被占用，如果被占用就提示更换
    
    // 接收文件缓冲
    let receivingMeta = null;
    let receivingBuffer = [];

    // 生成随机4位数字
    function generateRoomId() {
        return Math.floor(1000 + Math.random() * 9000).toString();
    }

    // 添加日志
    function addLog(msg, isError = false) {
        const logDiv = document.createElement('div');
        logDiv.className = 'log-entry';
        logDiv.style.color = isError ? '#ff6b6b' : '#8bc34a';
        logDiv.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}`;
        logArea.appendChild(logDiv);
        logDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        while(logArea.children.length > 50) {
            logArea.removeChild(logArea.children[0]);
        }
    }

    // 更新连接状态
    function updateConnectionStatus(connected, msg) {
        if(connected) {
            statusLed.className = 'led green';
            statusTextSpan.innerText = msg || '已连接';
            isConnected = true;
        } else {
            statusLed.className = 'led red';
            statusTextSpan.innerText = msg || '未连接';
            isConnected = false;
        }
        sendBtn.disabled = !isConnected || pendingFiles.length === 0;
    }

    // 渲染待发送文件列表
    function renderPendingFiles() {
        if(pendingFiles.length === 0) {
            selectedFilesList.innerHTML = '<div style="color:#999; text-align:center; padding:12px;">暂无待发送文件</div>';
            sendBtn.disabled = true;
            return;
        }
        
        let html = '';
        pendingFiles.forEach((file, idx) => {
            let sizeStr = file.size < 1024*1024 
                ? (file.size/1024).toFixed(1) + ' KB'
                : (file.size/(1024*1024)).toFixed(1) + ' MB';
            html += `
                <div class="file-item">
                    <div class="file-info">
                        <div class="file-name">📄 ${escapeHtml(file.name)}</div>
                        <div class="file-size">${sizeStr}</div>
                    </div>
                    <button class="remove-file" data-index="${idx}">✕</button>
                </div>
            `;
        });
        selectedFilesList.innerHTML = html;
        
        document.querySelectorAll('.remove-file').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const idx = parseInt(btn.getAttribute('data-index'));
                if(!isNaN(idx)) {
                    pendingFiles.splice(idx, 1);
                    renderPendingFiles();
                    sendBtn.disabled = !isConnected || pendingFiles.length === 0;
                }
                e.stopPropagation();
            });
        });
        
        sendBtn.disabled = !isConnected || pendingFiles.length === 0;
    }

    // 添加接收到的文件
    function addReceivedFile(file, dataUrl, blob) {
        if(receivedArea.querySelector('div') && receivedArea.children.length === 1 && receivedArea.children[0].innerText.includes('暂无')) {
            receivedArea.innerHTML = '';
        }
        
        let sizeStr = file.size < 1024*1024 
            ? (file.size/1024).toFixed(1) + ' KB'
            : (file.size/(1024*1024)).toFixed(1) + ' MB';
        
        let previewHtml = '';
        if(file.type.startsWith('image/') && dataUrl) {
            previewHtml = `<div class="received-preview"><img src="${dataUrl}" alt="预览"></div>`;
        }
        
        const receivedDiv = document.createElement('div');
        receivedDiv.className = 'received-item';
        receivedDiv.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                <div style="flex:1;">
                    <strong>📎 ${escapeHtml(file.name)}</strong><br>
                    <small>${sizeStr}</small>
                    ${previewHtml}
                </div>
                <button class="download-btn" style="margin-left:12px;">💾 保存</button>
            </div>
        `;
        
        const downloadBtn = receivedDiv.querySelector('.download-btn');
        if(dataUrl) {
            downloadBtn.addEventListener('click', () => {
                const a = document.createElement('a');
                a.href = dataUrl;
                a.download = file.name;
                a.click();
            });
        } else if(blob) {
            downloadBtn.addEventListener('click', () => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = file.name;
                a.click();
                URL.revokeObjectURL(url);
            });
        }
        
        receivedArea.prepend(receivedDiv);
        addLog(`✅ 接收文件: ${file.name} (${sizeStr})`);
    }

    // 发送文件
    function sendFiles() {
        if(!currentConn || !isConnected) {
            addLog('❌ 未连接，无法发送', true);
            return;
        }
        if(pendingFiles.length === 0) return;
        
        addLog(`📤 开始发送 ${pendingFiles.length} 个文件...`);
        
        pendingFiles.forEach((file, index) => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const arrayBuffer = ev.target.result;
                const metadata = {
                    type: 'file-meta',
                    name: file.name,
                    mime: file.type,
                    size: file.size
                };
                currentConn.send(JSON.stringify(metadata));
                setTimeout(() => {
                    if(currentConn && currentConn.open) {
                        currentConn.send(arrayBuffer);
                        addLog(`✓ 已发送: ${file.name}`);
                    }
                }, 100);
            };
            reader.onerror = () => addLog(`❌ 读取文件失败: ${file.name}`, true);
            reader.readAsArrayBuffer(file);
        });
        
        pendingFiles = [];
        renderPendingFiles();
        sendBtn.disabled = true;
    }

    // 处理接收到的数据
    function handleData(data) {
        if(typeof data === 'string') {
            try {
                const msg = JSON.parse(data);
                if(msg.type === 'file-meta') {
                    receivingMeta = {
                        name: msg.name,
                        mime: msg.mime,
                        size: msg.size
                    };
                    receivingBuffer = [];
                    addLog(`📥 准备接收: ${receivingMeta.name}`);
                }
            } catch(e) {
                addLog(`收到文本: ${data}`);
            }
        } else if(data instanceof ArrayBuffer) {
            if(receivingMeta) {
                receivingBuffer.push(data);
                let totalSize = receivingBuffer.reduce((sum, buf) => sum + buf.byteLength, 0);
                if(totalSize >= receivingMeta.size) {
                    let fullBuffer = new Uint8Array(totalSize);
                    let offset = 0;
                    for(let chunk of receivingBuffer) {
                        fullBuffer.set(new Uint8Array(chunk), offset);
                        offset += chunk.byteLength;
                    }
                    const blob = new Blob([fullBuffer], { type: receivingMeta.mime });
                    const file = new File([blob], receivingMeta.name, { type: receivingMeta.mime });
                    
                    if(receivingMeta.mime.startsWith('image/')) {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            addReceivedFile(file, e.target.result, null);
                        };
                        reader.readAsDataURL(blob);
                    } else {
                        addReceivedFile(file, null, blob);
                    }
                    
                    receivingMeta = null;
                    receivingBuffer = [];
                }
            }
        }
    }

    // 设置数据连接
    function setupConnection(conn) {
        if(currentConn && currentConn.open) {
            currentConn.close();
        }
        
        currentConn = conn;
        
        conn.on('open', () => {
            addLog(`🔗 连接成功！对方房间号: ${targetRoomInput.value}`);
            updateConnectionStatus(true, `已连接到房间 ${targetRoomInput.value}`);
        });
        
        conn.on('data', handleData);
        
        conn.on('close', () => {
            addLog(`🔌 连接已断开`);
            updateConnectionStatus(false, '连接已断开');
            currentConn = null;
        });
        
        conn.on('error', (err) => {
            addLog(`❌ 连接错误: ${err.message}`, true);
            updateConnectionStatus(false, '连接错误');
        });
    }

    // 使用房间号创建Peer
    async function createPeerWithRoom(roomId) {
        if(peer && !peer.destroyed) {
            peer.destroy();
        }
        
        return new Promise((resolve, reject) => {
            const peerId = `room_${roomId}`;
            const newPeer = new Peer(peerId);
            
            newPeer.on('open', () => {
                peer = newPeer;
                actualPeerId = peerId;
                myRoomId = roomId;
                roomNumberSpan.innerText = roomId;
                addLog(`✅ 房间号 ${roomId} 创建成功！`);
                updateConnectionStatus(false, '等待对方连接');
                
                // 监听连接
                peer.on('connection', (conn) => {
                    addLog(`📞 收到来自房间 ${conn.peer} 的连接`);
                    setupConnection(conn);
                });
                
                resolve();
            });
            
            newPeer.on('error', (err) => {
                if(err.type === 'unavailable-id') {
                    addLog(`⚠️ 房间号 ${roomId} 已被占用，自动更换`, true);
                    const newRoomId = generateRoomId();
                    createPeerWithRoom(newRoomId).then(resolve).catch(reject);
                } else {
                    reject(err);
                }
            });
        });
    }

    // 连接到对方房间
    function connectToRoom(roomId) {
        if(!peer) {
            addLog('❌ 请先创建房间', true);
            return;
        }
        if(!roomId || roomId.length !== 4 || !/^\d{4}$/.test(roomId)) {
            addLog('❌ 请输入4位数字房间号', true);
            return;
        }
        if(roomId === myRoomId) {
            addLog('❌ 不能连接自己的房间', true);
            return;
        }
        
        const targetPeerId = `room_${roomId}`;
        addLog(`🔄 正在连接到房间 ${roomId}...`);
        const conn = peer.connect(targetPeerId);
        setupConnection(conn);
    }

    // 更换房间号
    async function refreshRoom() {
        const newRoomId = generateRoomId();
        await createPeerWithRoom(newRoomId);
        if(currentConn) {
            currentConn.close();
            currentConn = null;
        }
        updateConnectionStatus(false, '已更换房间号');
        addLog(`🔄 房间号已更换为 ${newRoomId}`);
    }

    // 复制房间号
    function copyRoom() {
        if(!myRoomId) return;
        navigator.clipboard.writeText(myRoomId).then(() => {
            addLog('✅ 房间号已复制');
            const btn = copyRoomBtn;
            const originalText = btn.innerText;
            btn.innerText = '已复制！';
            setTimeout(() => {
                btn.innerText = originalText;
            }, 1500);
        }).catch(() => {
            addLog('❌ 复制失败', true);
        });
    }

    // 添加文件
    function addFiles(fileList) {
        for(let file of fileList) {
            if(file.size > 100 * 1024 * 1024) {
                addLog(`⚠️ ${file.name} 超过100MB，已跳过`, true);
                continue;
            }
            pendingFiles.push(file);
        }
        renderPendingFiles();
        sendBtn.disabled = !isConnected || pendingFiles.length === 0;
    }

    // 事件绑定
    connectBtn.addEventListener('click', () => {
        const targetRoom = targetRoomInput.value.trim();
        connectToRoom(targetRoom);
    });
    
    disconnectBtn.addEventListener('click', () => {
        if(currentConn) {
            currentConn.close();
            currentConn = null;
        }
        updateConnectionStatus(false, '已断开');
        addLog('🔌 手动断开连接');
    });
    
    copyRoomBtn.addEventListener('click', copyRoom);
    refreshRoomBtn.addEventListener('click', refreshRoom);
    
    // 限制输入为4位数字
    targetRoomInput.addEventListener('input', (e) => {
        e.target.value = e.target.value.replace(/[^\d]/g, '').slice(0, 4);
    });
    
    fileInput.addEventListener('change', (e) => {
        if(e.target.files.length > 0) {
            addFiles(Array.from(e.target.files));
        }
        fileInput.value = '';
    });
    
    dropzone.addEventListener('click', () => fileInput.click());
    
    dropzone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropzone.classList.add('drag-over');
    });
    
    dropzone.addEventListener('dragleave', () => {
        dropzone.classList.remove('drag-over');
    });
    
    dropzone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropzone.classList.remove('drag-over');
        if(e.dataTransfer.files.length > 0) {
            addFiles(Array.from(e.dataTransfer.files));
        }
    });
    
    sendBtn.addEventListener('click', sendFiles);
    
    // 初始化：随机生成4位房间号
    const initRoom = generateRoomId();
    createPeerWithRoom(initRoom).catch(err => {
        addLog(`❌ 初始化失败: ${err.message}`, true);
    });

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if(m === '&') return '&amp;';
            if(m === '<') return '&lt;';
            if(m === '>') return '&gt;';
            return m;
        });
    }
</script>
</body>
</html>
